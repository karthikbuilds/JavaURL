# Render Blueprint — deploys the JavaURL backend on Render.
#
# SIMPLEST OPTION (no database): run with the in-memory H2 dev profile.
#   - Set SPRING_PROFILES_ACTIVE=dev (below already does this by default).
#   - Flip "usePostgres" to true if you'd rather persist data in a managed Postgres.
#
# After deploy, set the FRONTEND override to the URL Render assigns,
# e.g. # APP_BASE_URL: https://javaurl-backend.onrender.com

services:
  - type: web
    name: javaurl-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw -B package -DskipTests
    startCommand: java -jar target/JavaURL-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: dev        # H2 in-memory — zero-setup demo; set to empty to use Postgres below
      - key: APP_BASE_URL
        sync: false        # set manually to your live https://... URL after deploy
    healthCheckPath: /actuator/health

  - type: postgres
    name: javaurl-postgres
    databaseName: javaurl
    user: javaurl
    plan: free
    # Attach the backend DATABASE_URL to the web service to use Postgres instead of H2:
    #   - envGroup: javaurl-postgres  (then drop SPRING_PROFILES_ACTIVE and set POSTGRES_URL accordingly)