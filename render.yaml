# Render Blueprint — deploys the JavaURL backend on Render.
#
# Simplest path: H2 in-memory (no database) — matches local dev via the dev profile.
# Exactly how we run it locally: SPRING_PROFILES_ACTIVE=dev.
#
# After deploy:
#   1. Set APP_BASE_URL to your live URL Render assigns (e.g. https://javaurl-backend.onrender.com).
#   2. Point the frontend override at that URL (see frontend/index.html).
#
# For PERSISTENT data later: Render Blueprints do NOT support a "postgres" service type.
# Instead create a Postgres DB from the Dashboard (New -> Postgres) and add POSTGRES_* env
# vars to this web service, and remove the SPRING_PROFILES_ACTIVE entry.

services:
  - type: web
    name: javaurl-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw -B package -DskipTests
    startCommand: java -jar target/JavaURL-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: APP_BASE_URL
        sync: false
    healthCheckPath: /actuator/health