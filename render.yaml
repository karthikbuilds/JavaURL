# Render Blueprint — deploys the JavaURL backend on Render.
#
# Built via Docker (runtime: docker) using the multi-stage backend/Dockerfile,
# which compiles the Spring Boot jar with Maven and runs it on a slim Temurin JRE.
# Uses the H2 in-memory dev profile (SPRING_PROFILES_ACTIVE=dev) — no database needed.

services:
  - type: web
    name: javaurl-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: SERVER_PORT
        value: 8081
      - key: APP_BASE_URL
        sync: false