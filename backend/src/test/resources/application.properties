spring.application.name=JavaURL

# Tests run against an in-memory H2 database (PostgreSQL-compatible mode).
spring.datasource.url=jdbc:h2:mem:javaurl-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.base-url=http://localhost:8080
app.code-length=7
app.redirect-status=302
app.cleanup.enabled=false
app.cleanup.retention-days=30
app.cleanup.interval-ms=3600000