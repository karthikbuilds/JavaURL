spring.application.name=JavaURL

# --- Server ---
# Backend always listens on 8081 (8080 is sometimes taken by other dev apps).
server.port=${PORT:${SERVER_PORT:8081}}

# --- Datasource: PostgreSQL (override any of these via environment variables) ---
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/javaurl}
spring.datasource.username=${POSTGRES_USER:javaurl}
spring.datasource.password=${POSTGRES_PASSWORD:javaurl}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Application settings ---
# Public base URL used when building the shortened links returned by the API.
app.base-url=${APP_BASE_URL:http://localhost:8081}
# Length of randomly generated short codes.
app.code-length=7
# HTTP status used when redirecting (301/302/307/308). 302 keeps click stats accurate.
app.redirect-status=302
# Scheduled maintenance of expired links.
app.cleanup.enabled=true
app.cleanup.retention-days=30
app.cleanup.interval-ms=3600000

# --- Actuator (health/metrics) ---
management.endpoints.web.exposure.include=health,info,metrics
# Only the Liveness "UP/DOWN" summary is exposed; component details stay protected.
management.endpoint.health.show-details=never
management.health.probes.enabled=true

# --- Caffeine cache for redirect resolution (avoids a DB hit on every visit) ---
spring.cache.type=caffeine
spring.cache.cache-names=shortUrls
spring.cache.caffeine.spec=maximumSize=100000,expireAfterWrite=10m,recordStats

# --- Per-client rate limiting for the public write API (POST / DELETE) ---
app.ratelimit.enabled=true
app.ratelimit.capacity=100
app.ratelimit.refill-per-second=50
